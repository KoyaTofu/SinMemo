<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SinMemo モックアップ</title>
<!--
  SinMemo モックアップ（v0.2）
  - このファイル 1 つで動く。外部のファイル・フォント・ライブラリは読み込まない（ネットにつながっていなくても動く）
  - 仕様は docs/要件/ と各機能のフォルダの基本設計（WBS 6 まで）に合わせている。差分は docs/記録/モックアップ検証.md 6 章
  - 画面を直接開く: ファイル名の後ろに #list #empty #listMenu #new #edit #editMenu #delete #discard
    #settings #theme #font #dark #splash を付ける（例: SinMemo_mockup.html#settings）
  - データはこのページを開いている間だけ（ページを読み込み直すとサンプルに戻る）
-->
<style>
:root {
  --page: #E9EBF0;
  --panel: #FFFFFF;
  --panel-text: #1B1C1F;
  --panel-sub: #5A5E6B;
  --panel-line: #D9DCE3;
  --panel-btn: #F3F4F7;
  --panel-accent: #2550C8;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--panel-text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
textarea { font: inherit; }

#wrap { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px 16px; flex-wrap: wrap; }

/* ---- 端末 ---- */
#phone { position: relative; width: 390px; max-width: 100%; height: 844px; max-height: calc(100vh - 32px); min-height: 560px;
  border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 10px #1B1C1F, 0 18px 40px rgba(0,0,0,.35);
  display: flex; flex-direction: column; background: var(--bg); color: var(--text); flex-shrink: 0; }
#phone.light { --bg:#FFFFFF; --bar:#F3F4F7; --text:#1B1C1F; --sub:#5A5E6B; --line:#E3E5EA; --accent:#2550C8; --onAccent:#FFFFFF; --card:#FFFFFF; --error:#B3261E; }
#phone.dark  { --bg:#141518; --bar:#1E2024; --text:#E7E8EC; --sub:#A9ADB8; --line:#2E3138; --accent:#9DB8FF; --onAccent:#0F1E46; --card:#272A31; --error:#FF9A8F; }
#status { height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  font-size: 13px; font-weight: 600; background: var(--statusBg, var(--bar)); color: var(--text); }
#status .icons { display: flex; gap: 6px; align-items: center; }
#screen { position: relative; flex-grow: 1; display: flex; flex-direction: column; min-height: 0; }
#navbar { height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
#navbar::after { content: ""; width: 120px; height: 4px; border-radius: 2px; background: var(--text); opacity: .5; }

.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px; background: var(--bar); }
.appbar h1 { margin: 0 0 0 16px; flex-grow: 1; font-size: 22px; font-weight: 500; }
.appbar h1.withNav { margin-left: 4px; }
.icon-btn { width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: var(--text);
  display: flex; align-items: center; justify-content: center; }
.icon-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--text) 8%, transparent); }
.icon-btn:disabled { opacity: .38; }
.spacer { flex-grow: 1; }

.list { flex-grow: 1; overflow-y: auto; padding-bottom: 88px; }
.row { display: block; width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--line); background: transparent;
  color: var(--text); padding: 14px 20px; }
.row:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.row .t { line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .d { line-height: 1.5; color: var(--sub); margin-top: 2px; }
.fab { position: absolute; right: 24px; bottom: 24px; width: 56px; height: 56px; border: none; border-radius: 16px;
  background: var(--accent); color: var(--onAccent); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.25); }

.menu { position: absolute; top: 56px; right: 12px; min-width: 168px; padding: 8px 0; border-radius: 4px; background: var(--card);
  box-shadow: 0 6px 20px rgba(0,0,0,.22); z-index: 5; }
.menu button { display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--text); padding: 12px 16px; font-size: 15px; }
.menu button:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.menu-scrim { position: absolute; inset: 0; z-index: 4; }

.editor { flex-grow: 1; display: flex; flex-direction: column; min-height: 0; }
.editor textarea { flex-grow: 1; border: none; outline: none; resize: none; background: transparent; color: var(--text);
  padding: 16px 20px; line-height: 1.7; }
.editor textarea::placeholder { color: var(--sub); }
.counter { text-align: right; padding: 4px 20px 8px; font-size: 13px; color: var(--sub); }
.counter.full { color: var(--error); }

.setting { display: block; width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--line); background: transparent;
  color: var(--text); padding: 12px 16px; min-height: 72px; }
button.setting:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.setting .n { font-size: 16px; line-height: 1.5; }
.setting .v { font-size: 14px; line-height: 1.45; color: var(--sub); }

.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); display: flex; align-items: center; justify-content: center; z-index: 10; }
.dialog { width: 312px; max-width: calc(100% - 48px); background: var(--card); color: var(--text); border-radius: 28px; padding: 24px 24px 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.dialog h2 { margin: 0 0 16px; font-size: 22px; font-weight: 400; }
.dialog p { margin: 0 0 20px; font-size: 16px; line-height: 1.5; color: var(--sub); }
.radio { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 48px; border: none; background: transparent; color: var(--text);
  text-align: left; padding: 0 4px; font-size: 16px; border-radius: 8px; }
.radio:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.radio .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--sub); flex-shrink: 0; position: relative; }
.radio[aria-checked="true"] .dot { border-color: var(--accent); }
.radio[aria-checked="true"] .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.text-btn { border: none; background: transparent; color: var(--accent); padding: 10px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
.text-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.text-btn.danger { color: var(--error); }

.snackbar { position: absolute; left: 12px; right: 12px; bottom: 16px; background: #313033; color: #F4EFF4; border-radius: 4px;
  padding: 14px 16px; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 20; }

/* スプラッシュ（設定 基本設計 5 章）: 白で固定、中央にアプリのアイコン */
.splash { position: absolute; inset: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; z-index: 50;
  transition: opacity 200ms linear; }
.splash.fade { opacity: 0; }
.app-icon { width: 96px; height: 96px; border-radius: 50%; background: #3DDC84; display: flex; align-items: center; justify-content: center; }

/* ホーム画面（アプリが裏にいる／閉じている） */
.home { position: absolute; inset: 0; z-index: 40; background: linear-gradient(160deg, #3A4A6B, #1C2233); color: #FFFFFF;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.home button { border: none; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; }
.home .app-icon { width: 64px; height: 64px; }
.home .hint { font-size: 12px; opacity: .8; max-width: 260px; text-align: center; line-height: 1.6; }

/* ---- 操作パネル ---- */
#panel { width: 380px; max-width: 100%; background: var(--panel); border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
#panel h2 { font-size: 15px; margin: 18px 0 8px; }
#panel h2:first-child { margin-top: 0; }
#panel p, #panel li { font-size: 13px; line-height: 1.6; color: var(--panel-sub); }
#panel p { margin: 0 0 8px; }
.pbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pbtn { border: 1px solid var(--panel-line); background: var(--panel-btn); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  text-align: left; color: var(--panel-text); line-height: 1.4; }
.pbtn:hover:not(:disabled) { border-color: var(--panel-accent); }
.pbtn:disabled { opacity: .45; }
.pbtn small { display: block; color: var(--panel-sub); font-size: 11px; }
#state { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: var(--panel-btn); color: var(--panel-text); }
select { font: inherit; font-size: 13px; padding: 6px; border-radius: 8px; border: 1px solid var(--panel-line); width: 100%; background: #fff; color: #1B1C1F; }
#log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; border: 1px solid var(--panel-line); border-radius: 8px; }
#log li { padding: 4px 8px; border-bottom: 1px solid var(--panel-line); }
#log li:last-child { border-bottom: none; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }

@media (max-width: 820px) {
  #wrap { padding: 12px 8px; gap: 16px; }
  #phone { box-shadow: 0 0 0 6px #1B1C1F, 0 10px 24px rgba(0,0,0,.3); border-radius: 28px; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="phone" class="light" aria-label="SinMemo の画面">
    <div id="status"><span id="clock">--:--</span><span class="icons" aria-hidden="true">
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 11h2V8H1zm4 0h2V6H5zm4 0h2V3H9zm4 0h2V0h-2z" fill="currentColor"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12"><rect x=".5" y=".5" width="18" height="11" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="13" height="8" rx="1" fill="currentColor"/><rect x="19.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
    </span></div>
    <div id="screen"></div>
    <div id="navbar" aria-hidden="true"></div>
  </div>

  <aside id="panel">
    <h2>SinMemo モックアップ（v0.2）</h2>
    <p>左の画面はそのまま操作できます。端末の操作（戻る・ホーム・システムによる終了など）は下のボタンで行います。ネットにつながっていなくても動きます。</p>
    <div id="state"></div>

    <h2>端末の操作</h2>
    <div class="pbtns">
      <button class="pbtn" id="p-back">◁ 戻る<small>Android の戻る（Esc キーでも）</small></button>
      <button class="pbtn" id="p-home">○ ホームへ<small>アプリを裏に回す（着信など）</small></button>
      <button class="pbtn" id="p-open">アプリを開く<small>ホーム画面のアイコン</small></button>
      <button class="pbtn" id="p-kill">システムが終了<small>裏にいる間にメモリ不足など</small></button>
      <button class="pbtn" id="p-remove">最近使ったアプリから消す<small>次は最初から起動</small></button>
      <button class="pbtn" id="p-reboot">端末を再起動<small>次は最初から起動</small></button>
    </div>
    <p style="margin-top:8px"><label class="chk"><input type="checkbox" id="p-dark"> 端末のダークモード（テーマ「端末の設定に従う」のときに効く）</label></p>

    <h2>画面を直接開く</h2>
    <select id="p-jump" aria-label="画面を直接開く">
      <option value="">選んでください…</option>
      <option value="list">S-01 メモ一覧</option>
      <option value="empty">S-01 メモ一覧（0 件）※メモを全部消す</option>
      <option value="listMenu">S-01 メニュー（⋮）</option>
      <option value="new">S-02 編集（新規）</option>
      <option value="edit">S-02 編集（既存）</option>
      <option value="long">S-02 編集（上限に近い長いメモ）</option>
      <option value="editMenu">S-02 メニュー（⋮）</option>
      <option value="delete">D-01 削除確認</option>
      <option value="discard">D-02 破棄確認</option>
      <option value="settings">S-03 設定</option>
      <option value="theme">D-03 テーマ</option>
      <option value="font">D-04 文字サイズ</option>
      <option value="dark">S-01 ダーク＋文字サイズ大</option>
      <option value="splash">起動（スプラッシュ）</option>
    </select>
    <div class="pbtns" style="margin-top:6px"><button class="pbtn" id="p-reset">サンプルに戻す<small>メモと設定を初めの状態に</small></button></div>

    <h2>操作の記録</h2>
    <ul id="log"></ul>

    <h2>割り切り</h2>
    <ul style="padding-left:18px;margin:0">
      <li>データはこのページを開いている間だけ。ページを読み込み直すとサンプルに戻る</li>
      <li>画面の回転は再現しない（実機では入力中の内容も設定のダイアログも消えない）</li>
      <li>キーボードは出ない。新規作成のときは入力欄にカーソルが入る</li>
      <li>文字の大きさは端末の表示サイズの設定によって実機と違うことがある</li>
    </ul>
  </aside>
</div>

<script>
"use strict";
(function () {
  // ===== 仕様の値 =====
  var LIMIT = 10000;            // 本文の上限（メモ編集 基本設計 3.4）
  var SHOW_COUNT_FROM = 9500;   // 文字数を出し始める（メモ編集 基本設計 決定事項 2）
  var SPLASH_MIN = 500;         // スプラッシュの最小表示（設定 基本設計 決定事項 3）
  var SPLASH_FADE = 200;
  var SETTINGS_READ = 60;       // 設定（DataStore）の読み込みにかかる時間の見立て
  var VERSION = "0.1.0";
  var FONT = { SMALL: { title: 15, date: 12, body: 15, label: "小" },
               MEDIUM: { title: 17, date: 13, body: 17, label: "中" },
               LARGE: { title: 20, date: 15, body: 20, label: "大" } };
  var THEME = { SYSTEM: "端末の設定に従う", LIGHT: "ライト", DARK: "ダーク" };
  var MSG_TOO_LONG = "10,000文字を超えるため貼り付けられません";

  // ===== 端末に残るもの（DB・DataStore） =====
  var db, settings;
  function sampleData() {
    var now = new Date();
    function at(daysAgo, h, m) { var d = new Date(now); d.setDate(d.getDate() - daysAgo); d.setHours(h, m, 0, 0); return d.getTime(); }
    var lastYear = new Date(now.getFullYear() - 1, 11, 28, 21, 4).getTime();
    var longBody = "長いメモ（文字数の表示の確認用）\n";
    while (longBody.length < 9688) longBody += "あいうえおかきくけこ";
    longBody = longBody.slice(0, 9688);
    var memos = [
      { body: "旅行の持ち物\n着替え 3 日分\n充電器\n常備薬", t: lastYear },
      { body: longBody, t: at(20, 9, 3) },
      { body: "\n\n打ち合わせメモ\n議題: 来月の予定\n担当: 自分", t: at(2, 9, 15) },
      { body: "牛乳、卵、パン、洗剤、トイレットペーパー、ティッシュ、電池、ゴミ袋、歯ブラシ\nほかに何か", t: at(0, Math.max(0, now.getHours() - 1), 30) }
    ];
    db = { nextId: 1, memos: [] };
    memos.forEach(function (x) { db.memos.push({ id: db.nextId++, body: x.body, createdAt: x.t, updatedAt: x.t }); });
    settings = { theme: "LIGHT", font: "MEDIUM" };
  }

  // ===== アプリの状態 =====
  // phase: running（前面）／background（裏。プロセスあり）／killed（裏でシステムに終了された。画面の状態は残る）／closed（タスクなし）
  var phase = "closed";
  var stack = [];          // 画面の積み重ね。{screen:'list'|'edit'|'settings', ...}
  var savedStack = null;   // システムが保存した画面の状態（killed のとき）
  var splash = null;       // {fading:bool}
  var snackbar = null, snackTimer = null;
  var deviceDark = false;
  var logs = [];

  function top() { return stack[stack.length - 1]; }
  function isDark() { return settings.theme === "DARK" || (settings.theme === "SYSTEM" && deviceDark); }
  function log(text) {
    var d = new Date();
    logs.unshift(pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "　" + text);
    logs = logs.slice(0, 80);
    renderPanel();
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function isBlank(s) { return /^[\s　]*$/.test(s); }
  function comma(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  // 一覧の 1 行目（メモ一覧 基本設計 3.1）: 先頭 200 文字のうち、空白だけでない最初の行
  function titleOf(body) {
    var lines = body.slice(0, 200).split("\n");
    for (var i = 0; i < lines.length; i++) if (!isBlank(lines[i])) return lines[i];
    return "";
  }
  // 更新日時（メモ一覧 基本設計 3.2）: 今年は MM/dd HH:mm、それ以外は yyyy/MM/dd HH:mm
  function dateOf(ms) {
    var d = new Date(ms), now = new Date();
    var md = pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    return d.getFullYear() === now.getFullYear() ? md : d.getFullYear() + "/" + md;
  }
  function sortedMemos() {
    return db.memos.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt || b.id - a.id; });
  }
  function findMemo(id) { for (var i = 0; i < db.memos.length; i++) if (db.memos[i].id === id) return db.memos[i]; return null; }

  // ===== 起動 =====
  // fresh: 最初から起動（最小表示時間をかける）。restore: システムに終了されたあと画面ごと戻る（かけない）
  function launch(kind) {
    var startedAt = Date.now();
    splash = { fading: false };
    stack = [];
    phase = "running";
    render();
    var minTime = kind === "fresh" ? SPLASH_MIN : 0;
    setTimeout(function () {
      // 設定を読み終わった
      if (kind === "restore" && savedStack) {
        stack = savedStack.map(restoreEntry).filter(Boolean);
        if (stack.length === 0) stack = [{ screen: "list" }];
        savedStack = null;
      } else {
        stack = [{ screen: "list" }];
      }
      render();
      var wait = Math.max(0, minTime - (Date.now() - startedAt));
      setTimeout(function () {
        splash.fading = true; render();
        setTimeout(function () { splash = null; render(); focusIfNew(); }, SPLASH_FADE);
      }, wait);
    }, SETTINGS_READ);
  }

  // 下書き 基本設計 3.2: 保存されていた画面の状態から編集画面を戻す
  function restoreEntry(e) {
    if (e.screen !== "edit") return { screen: e.screen };
    var draft = e.draftBody;
    if (e.memoId === 0) return editEntry(0, "", draft != null ? draft : "", true);
    var m = findMemo(e.memoId);
    if (m) return editEntry(m.id, m.body, draft != null ? draft : m.body, true);
    if (draft != null) { log("元のメモが消えていたので、書きかけで新規作成として開いた"); return editEntry(0, "", draft, true); }
    return null; // 元のメモも下書きもない → 一覧へ
  }
  function editEntry(memoId, original, text, restored) {
    return { screen: "edit", memoId: memoId, isNew: memoId === 0, original: original, text: text,
             dialog: null, menu: false, busy: false, restored: !!restored, draftBody: null };
  }

  // ===== 操作 =====
  var act = {
    openMemo: function (id) { var m = findMemo(id); stack.push(editEntry(id, m.body, m.body)); log("メモを開いた（id " + id + "）"); render(); },
    newMemo: function () { stack.push(editEntry(0, "", "")); log("「＋」で新規作成"); render(); focusIfNew(); },
    toggleMenu: function () { top().menu = !top().menu; render(); },
    closeMenu: function () { top().menu = false; render(); },
    openSettings: function () { top().menu = false; stack.push({ screen: "settings", dialog: null }); log("⋮ →「設定」"); render(); },
    save: function () {
      var e = top();
      if (isBlank(e.text) || e.busy) return;
      var now = Date.now();
      if (e.isNew) {
        var id = db.nextId++;
        db.memos.push({ id: id, body: e.text, createdAt: now, updatedAt: now });
        log("✓ 新しいメモとして保存（id " + id + "）");
      } else if (e.text !== e.original) {
        var m = findMemo(e.memoId); if (m) { m.body = e.text; m.updatedAt = now; }
        log("✓ 上書き保存（更新日時を今に）");
      } else {
        log("✓ 変更がないので保存せずに戻る（更新日時は変えない）");
      }
      stack.pop(); render();
    },
    editBack: function () {
      var e = top();
      if (e.text !== e.original) { e.dialog = "discard"; log("変更があるので D-02 破棄確認"); }
      else { stack.pop(); log("変更なしで一覧へ"); }
      render();
    },
    requestDelete: function () { var e = top(); e.menu = false; e.dialog = "delete"; log("⋮ →「削除」→ D-01"); render(); },
    confirmDelete: function () {
      var e = top(); db.memos = db.memos.filter(function (m) { return m.id !== e.memoId; });
      log("D-01「削除」でメモを削除"); stack.pop(); render();
    },
    confirmDiscard: function () { log("D-02「破棄」で変更を捨てて一覧へ"); stack.pop(); render(); },
    dismissDialog: function () { var e = top(); e.dialog = null; log("ダイアログを閉じた（何も変えない）"); render(); },
    settingsBack: function () { stack.pop(); log("設定から一覧へ"); render(); },
    openChoice: function (kind) {
      var e = top();
      e.dialog = { kind: kind, selected: kind === "theme" ? settings.theme : settings.font };
      log(kind === "theme" ? "「テーマ」→ D-03" : "「文字サイズ」→ D-04"); render();
    },
    select: function (value) { top().dialog.selected = value; render(); },
    confirmChoice: function () {
      var d = top().dialog; top().dialog = null;
      if (d.kind === "theme") { settings.theme = d.selected; log("OK: テーマを「" + THEME[d.selected] + "」に（保存してすぐ反映）"); }
      else { settings.font = d.selected; log("OK: 文字サイズを「" + FONT[d.selected].label + "」に（保存してすぐ反映）"); }
      render();
    }
  };

  // Android の戻る
  function androidBack() {
    if (phase !== "running" || splash) return;
    var e = top();
    if (e.menu) { e.menu = false; render(); return; }
    if (e.dialog) { act.dismissDialog(); return; }
    if (e.screen === "edit") { act.editBack(); return; }
    if (e.screen === "settings") { act.settingsBack(); return; }
    toBackground("一覧で戻る → ホームへ（アプリは裏に回る）");
  }
  function toBackground(msg) {
    if (phase !== "running" || splash) return;
    // 下書き 基本設計 3.1: 裏に回ったら（ON_STOP）編集中の本文を画面の状態に入れる
    stack.forEach(function (e) { if (e.screen === "edit") e.draftBody = e.text; });
    phase = "background"; log(msg || "ホームへ（アプリは裏に回る）"); render();
  }
  function openApp() {
    if (phase === "running") return;
    if (phase === "background") { phase = "running"; log("アプリに戻る（そのままの画面）"); render(); return; }
    if (phase === "killed") { log("アプリに戻る（システムに終了されていたので、画面と書きかけを戻す）"); launch("restore"); return; }
    log("最初から起動（スプラッシュ → 一覧）"); launch("fresh");
  }
  function systemKill() {
    if (phase !== "background") return;
    // 画面の状態（どの画面か・memoId・書きかけ）だけが残る。ダイアログやメニューは残らない
    savedStack = stack.map(function (e) { return e.screen === "edit" ? { screen: "edit", memoId: e.memoId, draftBody: e.draftBody } : { screen: e.screen }; });
    stack = []; phase = "killed"; log("システムがアプリを終了（画面の状態は残る）"); render();
  }
  function removeTask(msg) {
    if (phase === "closed") return;
    stack = []; savedStack = null; phase = "closed"; splash = null; log(msg); render();
  }

  // ===== 入力（メモ編集 基本設計 3.4: 上限を超える入力は丸ごと取り消す） =====
  var before = null; // 直前の {value, start, end}
  function onBeforeInput(ev) { var t = ev.target; before = { value: t.value, start: t.selectionStart, end: t.selectionEnd }; }
  function onInput(ev) {
    var t = ev.target, e = top();
    if (ev.isComposing) { e.text = t.value; updateEditChrome(); return; }
    applyLimit(t, e);
  }
  function applyLimit(t, e) {
    var prev = before || { value: e.text, start: e.text.length, end: e.text.length };
    if (t.value.length > LIMIT) {
      var grew = t.value.length - prev.value.length;
      t.value = prev.value;
      t.setSelectionRange(prev.start, prev.end);
      if (grew >= 2) { showSnackbar(MSG_TOO_LONG); log("上限を超える貼り付けを取り消した（" + comma(grew) + " 文字増えるはずだった）"); }
    }
    e.text = t.value; before = null;
    updateEditChrome();
  }
  function showSnackbar(text) {
    snackbar = text; clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { snackbar = null; render(); }, 4000);
    render();
  }

  // ===== 描画 =====
  var ICON = {
    more: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>',
    add: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>',
    back: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" fill="currentColor"/></svg>',
    check: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" fill="currentColor"/></svg>',
    android: '<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 9.5 19.4 6.4a.4.4 0 0 0-.7-.4l-1.8 3.1A11 11 0 0 0 12 8a11 11 0 0 0-4.9 1.1L5.3 6a.4.4 0 0 0-.7.4l1.8 3.1A10 10 0 0 0 1 17.5h22a10 10 0 0 0-5.4-8zM7 14.8a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm10 0a1 1 0 1 1 1-1 1 1 0 0 1-1 1z" fill="#FFFFFF"/></svg>'
  };
  var screenEl = document.getElementById("screen");
  var phoneEl = document.getElementById("phone");

  function render() {
    phoneEl.className = isDark() ? "dark" : "light";
    var html = "";
    if (phase === "running" && stack.length) {
      var e = top();
      if (e.screen === "list") html += listHtml(e);
      else if (e.screen === "edit") html += editHtml(e);
      else if (e.screen === "settings") html += settingsHtml(e);
    }
    if (snackbar && phase === "running") html += '<div class="snackbar" role="status">' + esc(snackbar) + "</div>";
    if (phase !== "running") html += homeHtml();
    if (splash) html += '<div class="splash' + (splash.fading ? " fade" : "") + '" data-testid="splash"><div class="app-icon">' + ICON.android + "</div></div>";

    var keepText = null;
    var ta = screenEl.querySelector("textarea");
    if (ta && document.activeElement === ta) keepText = { start: ta.selectionStart, end: ta.selectionEnd, scroll: ta.scrollTop };
    screenEl.innerHTML = html;
    document.getElementById("status").style.setProperty("--statusBg", splash ? "#FFFFFF" : (phase === "running" ? "var(--bar)" : "#3A4A6B"));
    document.getElementById("status").style.color = splash ? "#1B1C1F" : (phase === "running" ? "" : "#FFFFFF");
    bind();
    var nta = screenEl.querySelector("textarea");
    if (nta) { nta.value = top().text; updateEditChrome(); if (keepText) { nta.focus(); nta.setSelectionRange(keepText.start, keepText.end); nta.scrollTop = keepText.scroll; } }
    renderPanel();
  }

  function listHtml(e) {
    var f = FONT[settings.font];
    var rows = sortedMemos().map(function (m) {
      return '<button class="row" data-act="openMemo" data-id="' + m.id + '">' +
        '<div class="t" style="font-size:' + f.title + 'px">' + esc(titleOf(m.body)) + "</div>" +
        '<div class="d" style="font-size:' + f.date + 'px">' + dateOf(m.updatedAt) + "</div></button>";
    }).join("");
    return '<div class="appbar"><h1>SinMemo</h1><button class="icon-btn" aria-label="メニュー" data-act="toggleMenu">' + ICON.more + "</button></div>" +
      '<div class="list" data-testid="list">' + rows + "</div>" +
      '<button class="fab" aria-label="新規作成" data-act="newMemo">' + ICON.add + "</button>" +
      (e.menu ? '<div class="menu-scrim" data-act="closeMenu"></div><div class="menu" role="menu"><button role="menuitem" data-act="openSettings">設定</button></div>' : "");
  }

  function editHtml(e) {
    var f = FONT[settings.font];
    var h = '<div class="appbar"><button class="icon-btn" aria-label="戻る" data-act="editBack">' + ICON.back + '</button><div class="spacer"></div>' +
      '<button class="icon-btn" aria-label="保存" data-act="save" id="saveBtn">' + ICON.check + "</button>" +
      (e.isNew ? "" : '<button class="icon-btn" aria-label="メニュー" data-act="toggleMenu">' + ICON.more + "</button>") + "</div>" +
      '<div class="editor"><textarea aria-label="本文" placeholder="メモを入力" style="font-size:' + f.body + 'px"></textarea>' +
      '<div class="counter" id="counter" hidden></div></div>';
    if (e.menu) h += '<div class="menu-scrim" data-act="closeMenu"></div><div class="menu" role="menu"><button role="menuitem" data-act="requestDelete">削除</button></div>';
    if (e.dialog === "delete") h += confirmHtml("このメモを削除しますか？", "削除", "confirmDelete");
    if (e.dialog === "discard") h += confirmHtml("変更を破棄しますか？", "破棄", "confirmDiscard");
    return h;
  }
  function confirmHtml(msg, label, action) {
    return '<div class="scrim" data-act="dismissDialog" data-self="1"><div class="dialog" role="dialog" aria-label="' + esc(msg) + '"><p style="color:var(--text)">' + esc(msg) + "</p>" +
      '<div class="actions"><button class="text-btn" data-act="dismissDialog">キャンセル</button><button class="text-btn danger" data-act="' + action + '">' + esc(label) + "</button></div></div></div>";
  }
  function updateEditChrome() {
    var e = top(); if (!e || e.screen !== "edit") return;
    var save = document.getElementById("saveBtn"); if (save) save.disabled = isBlank(e.text) || e.busy;
    var c = document.getElementById("counter");
    if (c) {
      var n = e.text.length;
      c.hidden = n < SHOW_COUNT_FROM;
      c.textContent = comma(n) + "/" + comma(LIMIT) + "文字";
      c.className = "counter" + (n >= LIMIT ? " full" : "");
    }
    renderPanel();
  }

  function settingsHtml(e) {
    var h = '<div class="appbar"><button class="icon-btn" aria-label="戻る" data-act="settingsBack">' + ICON.back + '</button><h1 class="withNav">設定</h1></div>' +
      '<div style="flex-grow:1;overflow-y:auto">' +
      '<button class="setting" data-act="openChoice" data-kind="theme"><div class="n">テーマ</div><div class="v">' + THEME[settings.theme] + "</div></button>" +
      '<button class="setting" data-act="openChoice" data-kind="font"><div class="n">文字サイズ</div><div class="v">' + FONT[settings.font].label + "</div></button>" +
      '<div class="setting"><div class="n">バージョン</div><div class="v">' + VERSION + "</div></div></div>";
    if (e.dialog) {
      var d = e.dialog, opts = d.kind === "theme" ? [["SYSTEM", THEME.SYSTEM], ["LIGHT", THEME.LIGHT], ["DARK", THEME.DARK]]
                                                 : [["SMALL", "小"], ["MEDIUM", "中"], ["LARGE", "大"]];
      h += '<div class="scrim" data-act="dismissDialog" data-self="1"><div class="dialog" role="dialog" aria-label="' + (d.kind === "theme" ? "テーマ" : "文字サイズ") + '">' +
        "<h2>" + (d.kind === "theme" ? "テーマ" : "文字サイズ") + '</h2><div role="radiogroup">' +
        opts.map(function (o) {
          return '<button class="radio" role="radio" aria-checked="' + (d.selected === o[0]) + '" data-act="select" data-value="' + o[0] + '"><span class="dot"></span>' + o[1] + "</button>";
        }).join("") +
        '</div><div class="actions"><button class="text-btn" data-act="dismissDialog">キャンセル</button><button class="text-btn" data-act="confirmChoice">OK</button></div></div></div>';
    }
    return h;
  }

  function homeHtml() {
    var hint = phase === "background" ? "SinMemo は裏にいます（プロセスあり）" :
               phase === "killed" ? "SinMemo は裏にいる間にシステムに終了されました（画面の状態は残っています）" :
               "SinMemo は起動していません";
    return '<div class="home" data-testid="home"><button data-act="openApp" aria-label="SinMemo を開く"><span class="app-icon">' + ICON.android + "</span>SinMemo</button>" +
      '<div class="hint">' + hint + "</div></div>";
  }

  function bind() {
    screenEl.querySelectorAll("[data-act]").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        if (el.dataset.self && ev.target !== el) return; // ダイアログの外（暗い所）を押したときだけ
        ev.stopPropagation();
        var a = el.dataset.act;
        if (a === "openApp") return openApp();
        if (a === "openMemo") return act.openMemo(Number(el.dataset.id));
        if (a === "openChoice") return act.openChoice(el.dataset.kind);
        if (a === "select") return act.select(el.dataset.value);
        act[a]();
      });
    });
    var ta = screenEl.querySelector("textarea");
    if (ta) {
      ta.addEventListener("beforeinput", onBeforeInput);
      ta.addEventListener("input", onInput);
      ta.addEventListener("compositionend", function (ev) { applyLimit(ev.target, top()); });
    }
  }
  function focusIfNew() {
    var e = top();
    if (phase === "running" && !splash && e && e.screen === "edit" && e.isNew && !e.restored) {
      var ta = screenEl.querySelector("textarea"); if (ta) ta.focus();
    }
  }

  // ===== パネル =====
  function renderPanel() {
    var names = { list: "S-01 一覧", edit: "S-02 編集", settings: "S-03 設定" };
    var where = phase === "running" && stack.length ? stack.map(function (e) { return names[e.screen] + (e.screen === "edit" ? (e.isNew ? "（新規）" : "（id " + e.memoId + "）") : ""); }).join(" → ") : "-";
    var phaseName = { running: "前面で動作中", background: "裏にいる", killed: "システムに終了された（画面の状態あり）", closed: "起動していない" }[phase];
    var e = stack.length ? top() : null;
    document.getElementById("state").innerHTML =
      "状態: <b>" + phaseName + (splash ? "（スプラッシュ）" : "") + "</b><br>画面: " + esc(where) +
      "<br>メモ: " + db.memos.length + " 件　テーマ: " + THEME[settings.theme] + (settings.theme === "SYSTEM" ? "（今は" + (deviceDark ? "ダーク" : "ライト") + "）" : "") +
      "　文字サイズ: " + FONT[settings.font].label +
      (e && e.screen === "edit" ? "<br>本文: " + comma(e.text.length) + " 文字" + (e.text !== e.original ? "（変更あり）" : "（変更なし）") : "");
    document.getElementById("p-back").disabled = phase !== "running";
    document.getElementById("p-home").disabled = phase !== "running";
    document.getElementById("p-open").disabled = phase === "running";
    document.getElementById("p-kill").disabled = phase !== "background";
    document.getElementById("p-remove").disabled = phase === "closed";
    document.getElementById("log").innerHTML = logs.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("");
  }

  // ===== 画面を直接開く =====
  function jump(name) {
    clearTimeout(snackTimer); snackbar = null; splash = null; savedStack = null; phase = "running";
    var sorted = sortedMemos(), first = sorted[0];
    var longMemo = db.memos.filter(function (m) { return m.body.length >= SHOW_COUNT_FROM; })[0];
    stack = [{ screen: "list" }];
    switch (name) {
      case "empty": db.memos = []; break;
      case "listMenu": stack[0].menu = true; break;
      case "new": stack.push(editEntry(0, "", "")); break;
      case "edit": if (first) stack.push(editEntry(first.id, first.body, first.body)); break;
      case "long": if (longMemo) stack.push(editEntry(longMemo.id, longMemo.body, longMemo.body)); break;
      case "editMenu": if (first) { stack.push(editEntry(first.id, first.body, first.body)); top().menu = true; } break;
      case "delete": if (first) { stack.push(editEntry(first.id, first.body, first.body)); top().dialog = "delete"; } break;
      case "discard": stack.push(editEntry(0, "", "書きかけ")); top().dialog = "discard"; break;
      case "settings": stack.push({ screen: "settings", dialog: null }); break;
      case "theme": stack.push({ screen: "settings", dialog: { kind: "theme", selected: settings.theme } }); break;
      case "font": stack.push({ screen: "settings", dialog: { kind: "font", selected: settings.font } }); break;
      case "dark": settings.theme = "DARK"; settings.font = "LARGE"; break;
      case "splash": log("最初から起動（スプラッシュ → 一覧）"); launch("fresh"); return;
      default: break;
    }
    log("画面を直接開いた: " + name);
    render(); focusIfNew();
  }

  // ===== 初期化 =====
  sampleData();
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  deviceDark = !!(mq && mq.matches);
  document.getElementById("p-dark").checked = deviceDark;
  document.getElementById("p-dark").addEventListener("change", function (ev) {
    deviceDark = ev.target.checked; log("端末のダークモードを" + (deviceDark ? "オン" : "オフ")); render();
  });
  document.getElementById("p-back").addEventListener("click", androidBack);
  document.getElementById("p-home").addEventListener("click", function () { toBackground(); });
  document.getElementById("p-open").addEventListener("click", openApp);
  document.getElementById("p-kill").addEventListener("click", systemKill);
  document.getElementById("p-remove").addEventListener("click", function () { removeTask("最近使ったアプリから消した（書きかけも消える）"); });
  document.getElementById("p-reboot").addEventListener("click", function () { removeTask("端末を再起動した（書きかけも消える）"); });
  document.getElementById("p-reset").addEventListener("click", function () { sampleData(); log("サンプルに戻した"); jump("list"); });
  document.getElementById("p-jump").addEventListener("change", function (ev) { if (ev.target.value) { jump(ev.target.value); ev.target.value = ""; } });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { ev.preventDefault(); androidBack(); } });
  function tick() { var d = new Date(); document.getElementById("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  tick(); setInterval(tick, 10000);

  var start = (location.hash || "").replace("#", "");
  if (start) jump(start); else { log("最初から起動（スプラッシュ → 一覧）"); launch("fresh"); }
})();
</script>
</body>
</html>
